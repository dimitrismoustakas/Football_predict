[project]
name = "football-predict"
version = "0.3.2"
description = "Machine learning model for predicting football outcomes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.34.0",
    "pyarrow>=21.0.0",
    "python-dotenv>=1.2.1",
    "scikit-learn>=1.7.2",
    "soccerdata>=1.8.7",
    "torch>=2.6.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
soccerdata = { git = "https://github.com/dimitrismoustakas/soccerdata.git", branch = "fix/test-improvements" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
